name: Build & Release LeechCore SDK (Read-Only)

on:
  # 允许手动触发，并可以填写版本号
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号 (例如: v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write # 赋予创建 Release 的权限

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Build Solution
      run: msbuild LeechCore.sln /t:leechcore /p:Configuration=Release /p:Platform=x64

    - name: Package SDK into ZIP
      run: |
        # 创建一个临时文件夹用来存放 SDK
        New-Item -ItemType Directory -Force -Path sdk-windows
        
        # 搜索文件，排除新建的 sdk-windows 目录，并限制只取第一个结果（避免 bin 和 obj 目录下的文件互相覆盖）
        Get-ChildItem -Recurse -Filter "leechcore.dll" | Where-Object { $_.FullName -notmatch "sdk-windows" } | Select-Object -First 1 | Copy-Item -Destination sdk-windows\
        Get-ChildItem -Recurse -Filter "leechcore.lib" | Where-Object { $_.FullName -notmatch "sdk-windows" } | Select-Object -First 1 | Copy-Item -Destination sdk-windows\
        Get-ChildItem -Recurse -Filter "leechcore.h" | Where-Object { $_.FullName -notmatch "sdk-windows" } | Select-Object -First 1 | Copy-Item -Destination sdk-windows\
        
        # 将文件夹压缩成 ZIP 文件
        Compress-Archive -Path sdk-windows\* -DestinationPath leechcore-sdk-windows.zip

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.version }}
        name: "LeechCore Windows SDK ${{ github.event.inputs.version }} (Read-Only)"
        files: leechcore-sdk-windows.zip
        body: "自动编译的纯净版 LeechCore SDK。源码已物理关闭 `LcWriteMemory`，处于完全只读模式以保证安全。"
